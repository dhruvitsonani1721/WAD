<!DOCTYPE html>
<html>
<head>
    <title>Mountain Image Changer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe, #f8fafc, #dbeafe);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1e293b;
        }

        .container {
            width: 850px;
            padding: 35px;
            text-align: center;
        }

        .heading {
            font-size: 42px;
            margin-bottom: 10px;
            color: #0f3d5e;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 17px;
        }

        .image-box {
            position: relative;
            width: 100%;
            height: 470px;
            border-radius: 25px;
            overflow: hidden;
            background: white;
            box-shadow: 0 15px 40px rgba(15, 61, 94, 0.18);
            border: 1px solid #dbeafe;
        }

        #mountain {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 30px;
            text-align: left;
            background: linear-gradient(
                transparent,
                rgba(15, 61, 94, 0.8)
            );
        }

        .overlay h2 {
            font-size: 30px;
            margin-bottom: 8px;
            color: white;
        }

        .overlay p {
            color: #e0f2fe;
            font-size: 15px;
        }

        .info {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.8);
            padding: 18px 25px;
            border-radius: 15px;
            border: 1px solid #dbeafe;
            box-shadow: 0 8px 25px rgba(15, 61, 94, 0.08);
        }

        .timer {
            text-align: left;
            color: #475569;
        }

        .timer span {
            color: #0284c7;
            font-weight: bold;
        }

        .counter {
            font-size: 18px;
            color: #475569;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
        }

        @media (max-width: 900px) {
            .container {
                width: 95%;
            }

            .image-box {
                height: 400px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1 class="heading">Mountain Gallery</h1>

        <p class="subtitle">
            Automatic image changing using JavaScript setTimeout()
        </p>

        <div class="image-box">

            <img id="mountain"
            src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200">

            <div class="overlay">
                <h2 id="title">Mountain Adventure</h2>
                <p>Beautiful landscapes from around the world</p>
            </div>

        </div>

        <div class="info">

            <div class="timer">
                <span class="dot"></span>
                Image changes every <span>2 seconds</span>
            </div>

            <div class="counter">
                Image <span id="count">1</span> / 4
            </div>

        </div>

    </div>

    <script>
        var images = [
            "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200",
            "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?w=1200",
            "https://images.unsplash.com/photo-1464278533981-50106e6176b1?w=1200",
            "https://images.unsplash.com/photo-1486911278844-a81c5267e227?w=1200"
        ];

        var titles = [
            "Mountain Adventure",
            "Snowy Mountains",
            "Alpine Landscape",
            "Peak Explorer"
        ];

        var i = 0;

        function changeImage() {

            i++;

            if (i == images.length) {
                i = 0;
            }

            document.getElementById("mountain").src = images[i];

            document.getElementById("title").innerHTML = titles[i];

            document.getElementById("count").innerHTML = i + 1;

            setTimeout(changeImage, 2000);
        }

        setTimeout(changeImage, 2000);
    </script>

</body>
</html>
